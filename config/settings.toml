# paper-digest 설정. 경로의 ~ 는 홈 디렉터리로 펼쳐진다.

[paths]
# 비공개 로컬 저장소: state.db, raw/(초록·전문·PDF), inbox/, logs/
# 환경변수 PAPER_DIGEST_HOME 이 있으면 그 값이 우선한다.
data_dir = "~/.local/share/paper-digest"

[contact]
# Crossref polite pool, NCBI E-utilities, OpenAlex 요청에 붙는 연락처
email = "jonghwanyoon.bio@gmail.com"

[openalex]
# 비워 두면 키 없이 요청한다(DOI 단건 조회는 키 없이 일 1000회).
api_key = ""

[enrich]
# 근거 텍스트(초록/전문)를 못 구하면 이 일수 동안 매일 재시도한 뒤 "PDF 필요"로 표시
abstract_wait_days = 7

[summarizer]
# engine: "codex" | "claude"  (명령행 --engine/--model/--effort 로 덮어쓸 수 있음)
engine = "codex"
timeout_sec = 1800
# 실패(한도 제외) 몇 번이면 failed 로 둘지
max_attempts = 3
# LLM 에 넘길 근거 텍스트 최대 글자 수(넘으면 뒤를 잘라내고 잘렸다고 알린다)
max_input_chars = 150000

[summarizer.codex]
model = "gpt-6.1-sol"
effort = "xhigh"

[summarizer.claude]
model = "opus"
effort = "high"

[figures]
# 개요 그림. graphical abstract 가 있는 저널(journals.toml 의 graphical_abstract)은 출판사 이미지를 링크로 표시한다.
# GA 가 없으면 codex 내장 이미지 생성으로 요약 기반 개요도를 만든다(엔진이 codex 일 때만).
# 이미지 생성은 구독 한도를 일반 호출보다 3–5배 빨리 쓰므로 관련도가 높은 논문만 대상으로 한다.
ai_min_relevance = 7
# 그림 프롬프트를 쓰는 추론 강도(모델은 summarizer.codex.model)
ai_effort = "medium"
max_attempts = 2
# 사이트에 올릴 WebP 의 최대 가로 픽셀
max_width = 1600

[site]
title = "Journal Daily Digest"
timezone = "Asia/Seoul"

[publish]
# run 이 끝나면 data/ 변경분을 커밋하고 push 한다. remote 가 없으면 push 는 건너뛴다.
enabled = true
remote = "origin"
branch = "main"
